<title>Historia de la Familia Rodríguez Murillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* layout concept: a chaptered storybook — a map stage that zooms from the Atlantic into one valley, a text card below it, book-style prev/next turning */
  :root{
    --bg:#eef0e6;
    --surface:#fffdf8;
    --ink:#20281f;
    --ink-soft:#4b5447;
    --line:#d8dac8;
    --accent:#4f6b43;
    --accent-soft:#e3e9d7;
    --gold:#a87c2e;
    --clay:#a8512f;
    --sea:#2d4a52;
    --sea-light:#5d8a90;
    --land:#c9c097;
    --land-cr:#9fae7c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141b14;
      --surface:#1c241b;
      --ink:#ece9de;
      --ink-soft:#aab09e;
      --line:#38412f;
      --accent:#8fb97b;
      --accent-soft:#263226;
      --gold:#d3ac5c;
      --clay:#d98f6a;
      --sea:#16262b;
      --sea-light:#2d4a52;
      --land:#5a5438;
      --land-cr:#3c4a2e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141b14;
    --surface:#1c241b;
    --ink:#ece9de;
    --ink-soft:#aab09e;
    --line:#38412f;
    --accent:#8fb97b;
    --accent-soft:#263226;
    --gold:#d3ac5c;
    --clay:#d98f6a;
    --sea:#16262b;
    --sea-light:#2d4a52;
    --land:#5a5438;
    --land-cr:#3c4a2e;
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Work Sans", system-ui, sans-serif;
    padding-inline:0;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:"Fraunces", Georgia, serif; text-wrap:balance; font-weight:600; margin:0}

  .app{max-width:720px; margin:0 auto; padding:1.1rem 1.1rem 0; display:flex; flex-direction:column; min-height:100%}

  /* progress dots */
  .progress{display:flex; gap:.4rem; justify-content:center; flex-wrap:wrap; padding:.3rem 0 1rem}
  .dot{width:.55rem; height:.55rem; border-radius:50%; background:var(--line); border:none; padding:0; cursor:pointer; transition:transform .2s, background .2s}
  .dot:hover{transform:scale(1.3)}
  .dot.active{background:var(--accent); transform:scale(1.4)}
  .dot.seen{background:var(--gold)}

  /* map stage */
  .stage{
    position:relative; width:100%; aspect-ratio:600/420; max-height:46vh;
    border-radius:16px; overflow:hidden; background:var(--sea);
    box-shadow:0 1px 0 var(--line);
    transition:background .6s ease;
  }
  .stage svg{width:100%; height:100%; display:block}
  .scene{opacity:0; transition:opacity .6s ease; pointer-events:none}
  .scene.visible{opacity:1; pointer-events:auto}
  .map-region{
    font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.14em;
    fill:#1b2a1d; opacity:.8; paint-order:stroke; stroke:#fdf8ec; stroke-width:4px; stroke-linejoin:round;
  }
  .route-line{stroke:#1b2a1d; stroke-opacity:.45; stroke-width:1.6; fill:none}
  .trail-line{stroke:var(--gold); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round; transition:d .5s ease}
  .pin{cursor:pointer}
  .pin .pin-dot{fill:#fdf8ec; stroke:#1b2a1d; stroke-width:1.6; transition:all .3s ease}
  .pin .pin-label{
    font-family:"IBM Plex Mono",monospace; font-size:12px; fill:#1b2a1d; text-anchor:middle; font-weight:500;
    paint-order:stroke; stroke:#fdf8ec; stroke-width:3.5px; stroke-linejoin:round; transition:all .3s ease;
  }
  .pin.active .pin-dot{fill:var(--gold); stroke:#1b2a1d; r:10; filter:drop-shadow(0 0 5px rgba(168,124,46,.6))}
  .pin.active .pin-label{font-weight:700; font-size:13px}
  .pin.seen .pin-dot{fill:var(--gold); opacity:.7}
  .pin:hover .pin-dot{stroke-width:2.4}
  .hills-blob{fill:#ffffff22}
  .coast{stroke:#1b2a1d; stroke-opacity:.55; stroke-width:.8; stroke-linejoin:round}
  .border{fill:none; stroke:#1b2a1d; stroke-opacity:.3; stroke-width:.6; stroke-dasharray:3 2}
  .sea-label{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.3em; fill:#ffffff; opacity:.55; font-style:italic}
  .scene-atlantic .route-line{stroke:#fdf8ec; stroke-opacity:.75; stroke-width:1.8}
  .cr-land{fill:var(--land)}
  .hills-blob{fill:#7a6a3a; opacity:.12}
  .trail-line{stroke:#a8512f !important}
  .pin.active .pin-dot,.pin.seen .pin-dot{fill:#a8512f}
  .volcano{fill:#7a6a3a; stroke:#1b2a1d; stroke-opacity:.5; stroke-width:.8}
  .vol-label{font-family:"IBM Plex Mono",monospace; font-size:9px; text-anchor:middle; fill:#3d3520; opacity:.8}
  .land-label{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.3em; fill:#1b2a1d; opacity:.55}
  .inset-bg{fill:#fdf8ec; fill-opacity:.85; stroke:#1b2a1d; stroke-opacity:.4}
  .inset-land{fill:#9fae7c; stroke:#1b2a1d; stroke-opacity:.5; stroke-width:.6}
  .inset-box{fill:#a8512f; fill-opacity:.25; stroke:#a8512f; stroke-width:1.2}
  .trail-line{stroke-width:3.4 !important}
  .map-grid{stroke:#ffffff; stroke-opacity:.12; stroke-width:.6; fill:none}

  /* text card */
  .card{flex:1; padding:1.6rem .2rem 1.4rem; min-height:0}
  .era{
    font-family:"IBM Plex Mono",monospace; font-size:.74rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--gold); margin-bottom:.6rem;
  }
  .card h2{font-size:clamp(1.5rem,5vw,2.1rem); line-height:1.12}
  .card .body{margin-top:1rem; display:flex; flex-direction:column; gap:.9rem}
  .card p{color:var(--ink-soft); line-height:1.72; font-size:1.03rem; max-width:62ch}
  .card p b{color:var(--ink); font-weight:600}

  .cover{text-align:center; padding-top:1rem}
  .cover h1{font-size:clamp(2.1rem,7vw,3rem); line-height:1.06}
  .cover .sub{color:var(--ink-soft); margin-top:1rem; font-size:1.08rem; line-height:1.6; max-width:44ch; margin-inline:auto}

  /* nav */
  .nav{
    position:sticky; bottom:0; display:flex; align-items:center; justify-content:space-between; gap:.8rem;
    padding:.9rem 0 calc(.9rem + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .navbtn{
    font-family:"Work Sans",sans-serif; font-weight:600; font-size:.95rem;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:.75rem 1.3rem; cursor:pointer;
    display:flex; align-items:center; gap:.4rem; transition:transform .15s, background .15s;
  }
  .navbtn:hover{transform:translateY(-1px)}
  .navbtn:active{transform:translateY(0)}
  .navbtn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .navbtn:disabled{opacity:.35; cursor:default; transform:none}
  .navbtn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:.75rem .5rem}
  .counter{font-family:"IBM Plex Mono",monospace; font-size:.76rem; color:var(--ink-soft); white-space:nowrap}

  @media (prefers-reduced-motion: reduce){
    .scene, .navbtn, .dot, .pin *{transition:none !important}
  }
</style>

      key:'cover', scene:'atlantic', pins:[], trail:[], cover:true,
      html:'<div class="cover"><h1>Cinco Siglos,<br>Una Familia</h1>' +
        '<p class="sub">De un pueblito en España a los cerros y valles de Costa Rica — la historia de cómo dos familias, por caminos completamente distintos a lo largo de los mismos cuatro siglos, terminaron siendo una sola.</p></div>',
      nextLabel:'Comenzar la historia →'
    },
    {
      key:'merida', scene:'atlantic', pins:['merida'], trail:[],
      era:'Extremadura, España · finales de los 1400', title:'Un Pueblo Llamado Mérida',
      body:[
        'En un pueblito llamado Mérida, en la tierra seca y montañosa de Extremadura, un hombre llamado Alonso González y una mujer llamada Olalla González criaban a su familia allá por los años 1470. España apenas se había unido bajo los Reyes Católicos, Fernando e Isabel. Colón todavía no había zarpado. Nadie en Mérida se imaginaba que el mundo estaba a punto de volverse muchísimo más grande.',
        'Su hija, también llamada Olalla, se casó con un hombre llamado Francisco Rodríguez. Ninguno de los dos saldría nunca de España. Pero su hijo sí lo haría — y no sería la última persona que ese pueblito tan sencillo mandaría a cruzar el océano.'
      ]
    },
    {
      key:'whyleft', scene:'atlantic', pins:['merida'], trail:[],
      era:'España · años 1500', title:'Por Qué Se Fueron',
      body:[
        'Extremadura era un lugar raro para nacer con ambición. La región estaba llena de hidalgos — hombres de sangre noble que, por una ley española de herencia llamada mayorazgo, casi no tenían tierra. El hijo mayor se quedaba con todo; a los demás les tocaba un título y nada con qué respaldarlo. No es casualidad que Extremadura haya dado tantos de los conquistadores más famosos de España, entre ellos Cortés y Pizarro: era tierra de hijos orgullosos, sin tierra propia, y sin nada que perder.',
        'La mayoría de los que cruzaron eran hombres jóvenes, de unos veintitantos años, que zarpaban desde el puerto de Sevilla. En las primeras décadas sí fueron casi puros hombres: las mujeres eran apenas 1 de cada 20 entre los primeros que llegaron al Caribe. Pero para los mismos años en que cruzaron los hombres de esta familia — los 1550 y 1560 — eso ya estaba cambiando: pronto las mujeres fueron una cuarta parte o más de los recién llegados, porque la Corona empujaba a los hombres ya establecidos a mandar traer esposa, y familias enteras empezaron a seguir esa primera ola.',
        'Llamémoslo como fue: una apuesta sin vuelta atrás, hecha por muchachos sin nada que heredar, sobre un país que casi ninguno volvería a ver.'
      ]

  var PIN_COORDS = {
    'merida':{x:528,y:138}, 'nicaragua':{x:59,y:312}, 'cartago-world':{x:76,y:327}, 'sancarlos':{x:259,y:114}, 'heredia':{x:381,y:240}, 'alajuela':{x:345,y:232}, 'sanjose':{x:395,y:267}, 'curridabat':{x:410,y:275}, 'cartago':{x:457,y:293}, 'esparza':{x:170,y:244}
  };
  var JUMP_TO = {'merida':1,'nicaragua':3,'cartago-world':3,'cartago':4,'curridabat':6,'heredia':7,'alajuela':9,'esparza':10,'sancarlos':11,'sanjose':12};

  var idx = 0;
  try {
    var saved = localStorage.getItem('rmf_chapter_es');
    if (saved !== null) { var n = parseInt(saved,10); if (n>=0 && n<CH.length) idx = n; }
  } catch(e){}

  var progressEl = document.getElementById('progress');
  var cardEl = document.getElementById('card');
  var counterEl = document.getElementById('counter');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var sceneAtlantic = document.getElementById('scene-atlantic');
  var sceneCR = document.getElementById('scene-costarica');
  var trailPath = document.getElementById('trail-path');
  var stageEl = document.getElementById('stage');

  CH.forEach(function(c, i){
    var d = document.createElement('button');
    d.className = 'dot';
    d.setAttribute('aria-label', c.title || 'Portada');
    d.addEventListener('click', function(){ go(i); });
    progressEl.appendChild(d);
  });

  function buildTrail(keys){
    if (!keys || keys.length < 1) return '';
    var pts = keys.map(function(k){ var c = PIN_COORDS[k]; return c.x+','+c.y; });
    return 'M' + pts.join(' L');
  }

  function render(){
    var c = CH[idx];

    Array.prototype.forEach.call(progressEl.children, function(d, i){
      d.classList.toggle('active', i === idx);
      d.classList.toggle('seen', i < idx);
    });

    sceneAtlantic.classList.toggle('visible', c.scene === 'atlantic');
    sceneCR.classList.toggle('visible', c.scene === 'costarica');
    stageEl.classList.toggle('scene-land', c.scene === 'costarica');

    var activeSet = {};
    (c.pins||[]).forEach(function(p){ activeSet[p] = true; });
    var seenSet = {};
    (c.trail||[]).forEach(function(p){ seenSet[p] = true; });
    document.querySelectorAll('.pin').forEach(function(g){
      var key = g.getAttribute('data-pin');
      g.classList.toggle('active', !!activeSet[key]);
      g.classList.toggle('seen', !activeSet[key] && !!seenSet[key]);
    });
    trailPath.setAttribute('d', buildTrail(c.trail));

    if (c.cover) {
      cardEl.innerHTML = c.html;
    } else {
      cardEl.innerHTML = '<div class="era">'+c.era+'</div><h2>'+c.title+'</h2>' +
        '<div class="body">' + c.body.map(function(p){ return '<p>'+p+'</p>'; }).join('') + '</div>';
    }

    btnPrev.disabled = (idx === 0);
    btnPrev.style.visibility = idx === 0 ? 'hidden' : 'visible';
    btnNext.textContent = c.nextLabel || (idx === CH.length-1 ? 'Volver al inicio ↺' : 'Siguiente →');
    counterEl.textContent = c.cover ? '' : (idx) + ' / ' + (CH.length-1);

    try { localStorage.setItem('rmf_chapter_es', String(idx)); } catch(e){}
  }

  function go(i){
    idx = Math.max(0, Math.min(CH.length-1, i));
    render();
  }

  btnPrev.addEventListener('click', function(){ go(idx-1); });
  btnNext.addEventListener('click', function(){
    if (idx === CH.length-1) { go(0); } else { go(idx+1); }
  });

  document.querySelectorAll('.pin').forEach(function(g){
    g.addEventListener('click', function(){
      var key = g.getAttribute('data-pin');
      if (JUMP_TO.hasOwnProperty(key)) go(JUMP_TO[key]);
    });
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') go(idx+1);
    if (e.key === 'ArrowLeft') go(idx-1);
  });

  var touchStartX = null;
  document.addEventListener('touchstart', function(e){ touchStartX = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) { if (dx < 0) go(idx+1); else go(idx-1); }
    touchStartX = null;
  }, {passive:true});

  render();
})();
</script>
